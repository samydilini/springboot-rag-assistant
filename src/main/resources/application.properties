spring.application.name=rag-assistant

spring.datasource.url=jdbc:postgresql://localhost:5432/ragassistant
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA: our @Entity classes are managed here (added in Increment 2).
# The pgvector table is managed by Spring AI (JdbcTemplate), not Hibernate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Local embeddings (Spring AI Transformers, ONNX in-process) ---
# Default model is all-MiniLM-L6-v2 (384 dimensions). No API key; the model is
# downloaded and cached on first startup, then runs fully offline.

# --- pgvector store (Spring AI) ---
# Auto-creates the vector extension + vector_store table on startup.
# dimensions MUST match the embedding model (384 for all-MiniLM-L6-v2).
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# --- RAG parameters (bound to RagProperties) ---
rag.chunk-size=800
rag.chunk-overlap=100
rag.top-k=5
rag.generation-model=claude-sonnet-5
rag.max-ingestion-attempts=3

# Increase multipart limits for PDF uploads (used in Increment 2).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB